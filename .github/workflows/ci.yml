name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catch newly published vulnerabilities

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.21", "stable"]
        exclude:
          # Go 1.21 binaries abort on current macOS runners (dyld: missing LC_UUID);
          # a toolchain/OS incompatibility, not a package bug.
          - os: macos-latest
            go: "1.21"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go mod tidy is a no-op
        run: go mod tidy && git diff --exit-code -- go.mod
      - name: tests (race, coverage)
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24" # must be >= the Go version golangci-lint v1.64 was built with
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
          go-package: ./...

  version-matches-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: version.go equals the tag
        run: |
          v=$(sed -n 's/^const Version = "\(.*\)"/\1/p' version.go)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "version.go=$v but tag=${GITHUB_REF_NAME}"; exit 1; }
